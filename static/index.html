<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>

    
    <script>
        var authToken = localStorage.getItem('token');
        var userRole = localStorage.getItem('role');
        var userShift = localStorage.getItem('shift_type');
        const nativeFetch = window.fetch.bind(window);

        async function doLogin() {
            const btn = document.querySelector('#loginScreen button');
            const statusEl = document.getElementById('loginStatus');
            if (!btn || !statusEl) return;
            
            btn.disabled = true;
            statusEl.innerText = "در حال بررسی...";
            statusEl.style.color = "blue";

            try {
                const res = await nativeFetch('http://185.222.163.15:8000/api/login', {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({phone_number: toEnglishDigits(document.getElementById('phone').value), password: toEnglishDigits(document.getElementById('password').value)})
                });
                const data = await res.json();
                
                if (res.ok) {
                    localStorage.setItem('token', data.token); 
                    localStorage.setItem('role', data.role); 
                    localStorage.setItem('shift_type', data.shift_type || '');
                    localStorage.setItem('userName', data.name);
                    
                    statusEl.innerText = "✅ ورود موفق. در حال انتقال...";
                    statusEl.style.color = "green";
                    setTimeout(() => { window.location.reload(); }, 300);
                } else { 
                    statusEl.innerText = data.detail || "خطا در ورود"; 
                    statusEl.style.color = "red";
                    btn.disabled = false;
                }
            } catch(e) {
                statusEl.innerText = "خطای شبکه: " + e.message;
                statusEl.style.color = "red";
                btn.disabled = false;
            }
        }

        window.fetch = async function(...args) {
            let [url, options] = args;
            if (typeof url !== 'string' || !url.startsWith('http')) {
                return nativeFetch(...args);
            }
            const method = (options && options.method) || 'GET';
            const isGet = method === 'GET';
            const urlObj = new URL(url);
            const path = urlObj.pathname;

            if (navigator.onLine) {
                try {
                    const response = await nativeFetch(...args);
                    if (response) return response;
                } catch (err) { console.warn("Network failed. Fallback to offline."); }
            }

            if (isGet) {
                let dbData = null;
                try {
                    const raw = localStorage.getItem('offline_db');
                    if (raw) dbData = JSON.parse(raw);
                } catch(e) {}

                if (!dbData || !dbData.shifts) {
                    if (path === '/api/admin/users') return new Response(JSON.stringify({users: []}), {status: 200});
                    if (path.includes('/machines')) return new Response(JSON.stringify({machines: []}), {status: 200});
                    if (path === '/api/admin/pending_shifts') return new Response(JSON.stringify({status: 'ok', shifts: []}), {status: 200});
                    if (path === '/api/admin/all_shifts') return new Response(JSON.stringify({status: 'ok', shifts: []}), {status: 200});
                    return new Response(JSON.stringify({detail: 'دیتابیس خالی است'}), {status: 404});
                }

                const allShifts = dbData.shifts || [];
                const allUsers = dbData.users || [];
                const allMachines = dbData.machines || [];

                if (path === '/api/admin/pending_shifts') return new Response(JSON.stringify({status: 'ok', shifts: allShifts.filter(s => s.status === 'pending').map(s => ({...s, potential_bonus: s.jig_bonus || 0, monthly_set_rank: 1}))}), {status: 200});
                if (path === '/api/admin/all_shifts') return new Response(JSON.stringify({status: 'ok', shifts: allShifts}), {status: 200});
                if (path === '/api/admin/users') return new Response(JSON.stringify({users: allUsers}), {status: 200});
                if (path === '/api/admin/machines' || path === '/api/machines') return new Response(JSON.stringify({machines: allMachines.map(m=>m.name)}), {status: 200});
                
                if (path.includes('/reports/')) return new Response(JSON.stringify({status: 'empty'}), {status: 200});
                return new Response(JSON.stringify([]), {status: 200});
            } else {
                return new Response(JSON.stringify({status:'queued', message:'آفلاین - در صف سینک'}), {status:200});
            }
        };


        function routeUser() {
            document.querySelectorAll('.container').forEach(c => c.classList.remove('active'));
            const token = localStorage.getItem('token');
            const role = localStorage.getItem('role');
            
            if (!token || token === 'undefined' || token === 'null') {
                showSection('loginScreen');
            } else if (role === 'admin') {
                showSection('adminScreen');
                document.getElementById('adminWelcomeName').innerText = `👋 خوش آمدید ${localStorage.getItem('userName') || 'مدیر'}`;
                if (navigator.onLine) prefetchOfflineData(); 
            } else {
                showSection('operatorDashboard');
                document.getElementById('opWelcomeName').innerText = `👋 خوش آمدید ${localStorage.getItem('userName') || 'اپراتور'}`;
                document.getElementById('operatorShiftDisplay').innerHTML = `<div class="shift-badge">شیفت شما: ${localStorage.getItem('shift_type') || ''}</div>`;
                loadMachines();
                checkOperatorNotifications();
                if (navigator.onLine) prefetchOfflineData();
            }
        }

        function setTodayDate() {
            fetch('http://185.222.163.15:8000/api/today').then(r => r.json()).then(d => {
                document.getElementById('date').value = toPersianDigits(d.date);
                $('#date').persianDatepicker('setDate', d.date);
                checkExistingShift();
                loadImmediatePrev();
            });
        }

        function clearFields() {
            document.getElementById('counter').value = '';
            document.getElementById('design_code').value = '';
            document.getElementById('set_number').value = '';
            document.querySelectorAll('#parts-container input').forEach(cb => cb.checked = false);
            document.getElementById('photo').value = '';
            document.getElementById('isZeroWork').checked = false;
            document.getElementById('zeroReason').value = 'غیبت';
            document.getElementById('zeroNote').value = '';
            document.getElementById('requestBonus').checked = false;
            document.getElementById('isChadorWork').checked = false;
            document.getElementById('chadorCount').value = '';
            for (let i = 1; i <= 6; i++) document.getElementById('chadorInvoice' + i).value = '';
            toggleZeroMode();
            toggleChadorMode();
        }

        async function fetchAndSetSuggestedDate() {
            try {
                const machineVal = document.getElementById('machine') ? document.getElementById('machine').value : '';
                let url = 'http://185.222.163.15:8000/api/operator/suggest_date?t=' + Date.now();
                if (machineVal) url += `&machine=${encodeURIComponent(machineVal)}`;
                
                const res = await fetch(url, { headers: { 'Authorization': `Bearer ${authToken}` } });
                const data = await res.json();
                
                if (data.date) {
                    const dateInput = document.getElementById('date');
                    dateInput.value = toPersianDigits(data.date);
                    setTimeout(() => {
                        try {
                            $('#date').persianDatepicker('setDate', data.date);
                            dateInput.value = toPersianDigits(data.date);
                        } catch(e) { console.error(e); }
                    }, 100);
                    checkExistingShift();
                    loadImmediatePrev();
                }
            } catch (e) { console.error(e); }
        }

        async function loadImmediatePrev() {
            const dateInput = document.getElementById('date').value;
            const date = toEnglishDigits(dateInput);
            const machine = document.getElementById('machine').value;
            const shift = userShift || localStorage.getItem('shift_type');
            if (!date || !machine || !shift) return;

            try {
                const res = await fetch(`http://185.222.163.15:8000/api/operator/immediate_prev_info?date=${date}&machine=${encodeURIComponent(machine)}&shift_type=${encodeURIComponent(shift)}&t=${Date.now()}`, { headers: { 'Authorization': `Bearer ${authToken}` } });
                const data = await res.json();
                const div = document.getElementById('immediatePrevDisplay');
                if (!div) return;
                
                if (data.exists) {
                    const s = data.data;
                    let workHtml = s.zero_reason ? `<span style="color:#e74c3c;">⚠️ کارکرد صفر: ${s.zero_reason}</span>` : `طرح: ${toPersianDigits(s.design)} | ست: ${toPersianDigits(s.set_number)} | شمارنده: ${formatNum(s.counter)}`;
                    
                    if (s.jig_bonus > 0) {
                        workHtml += ` | <span style="color:#27ae60; font-weight:bold;">🎁 ست جدید</span>`;
                    }
                    
                    let statusText = s.status === 'pending' ? '<span style="color:#e67e22;"> (در انتظار تایید)</span>' : '';
                    div.innerHTML = `
                        <div style="background:#fff8e1; padding:12px; border-radius:8px; border:1px solid #ffe082;">
                            <div style="font-weight:bold; color:#f57f17; margin-bottom:5px; font-size:15px;">📋 شیفت قبلی (${s.shift_type} ${s.day_name}):</div>
                            <div style="font-size:13px; line-height:1.6; color:#2c3e50;">
                                <strong>تاریخ:</strong> ${formatDate(s.date)}${statusText}<br>
                                <strong>چرخ:</strong> ${toPersianDigits(s.machine)} | <strong>اپراتور:</strong> ${s.operator_name}<br>
                                ${workHtml}
                            </div>
                        </div>`;
                } else {
                    let missingText = "شیفت قبلی ثبت نشده است.";
                    if (data.expected_date && data.expected_shift) {
                        if (data.rejected) {
                            missingText = `شیفت ${data.expected_shift} تاریخ ${formatDate(data.expected_date)} رد شده است.`;
                        } else {
                            missingText = `شیفت ${data.expected_shift} تاریخ ${formatDate(data.expected_date)} ثبت نشده است.`;
                        }
                    }
                    div.innerHTML = `
                        <div style="background:#fdf2f2; padding:12px; border-radius:8px; border:1px solid #f5c6cb;">
                            <div style="font-weight:bold; color:#c0392b; font-size:14px; text-align:center;">
                                ⚠️ ${missingText}
                            </div>
                        </div>`;
                }
            } catch (e) { console.error(e); }
        }

                        <div style="font-weight:bold; color:#16a085; margin-bottom:5px; font-size:15px;">📌 آخرین شیفت (${s.shift_type}) شما:</div>

                            <strong>تاریخ:</strong> ${formatDate(s.date)} (${s.day_name})<br>
                            <strong>چرخ:</strong> ${toPersianDigits(s.machine)}<br>
                            ${workHtml}
                        </div>
                
                                    window.location.reload();
                                };
                                syncXhr.send();
                            }, 100);
                            
                        } catch(e) {
                            statusEl.innerText = "خطا در پردازش اطلاعات سرور";
                            statusEl.style.color = "red";
                            btn.disabled = false;
                        }
                    } else {
                        try {
                            var err = JSON.parse(xhr.responseText);
                            statusEl.innerText = parseError(err.detail);
                        } catch(e) {
                            statusEl.innerText = "خطای سرور: " + xhr.status;
                        }
                        statusEl.style.color = "red";
                        btn.disabled = false;
                    }
                }
            };
            xhr.send(JSON.stringify({phone_number: phone, password: pass}));
        }

                    } catch(e) { console.error(e); }

        async function loadMachines() {
            try {
                const res = await fetch('http://185.222.163.15:8000/api/machines', { headers: { 'Authorization': `Bearer ${authToken}` } });
                const data = await res.json();
                const select = document.getElementById('machine');
                if(select) select.innerHTML = data.machines.map(m => `<option value="${m}">${toPersianDigits(m)}</option>`).join('');
                
                const filterSelect = document.getElementById('opListMachine');
                if (filterSelect) {
                    filterSelect.innerHTML = '<option value="all">همه چرخ‌ها</option>' + data.machines.map(m => `<option value="${m}">${toPersianDigits(m)}</option>`).join('');
                }
            } catch (e) { console.error(e); }
            checkExistingShift();
        }

        async function checkOperatorNotifications() {
            try {
                const res = await fetch('http://185.222.163.15:8000/api/operator/notifications', { headers: { 'Authorization': `Bearer ${authToken}` } });
                const data = await res.json();
                if (data.rejected_count > 0) {
                    lastRejectedDate = data.last_rejected_date;
                    document.getElementById('opNotifAlert').style.display = 'block';
                    document.getElementById('opNotifAlert').innerText = `⚠️ شما ${toPersianDigits(data.rejected_count)} کارکرد رد شده دارید! برای اصلاح کلیک کنید.`;
                } else {
                    document.getElementById('opNotifAlert').style.display = 'none';
                }
            } catch(e) { console.error(e); }
        }

        async function goToRejectedShifts() {
            showSection('opShiftListSection');
            await loadMachines();
            
            if (lastRejectedDate) {
                document.getElementById('opListStartDate').value = lastRejectedDate;
                document.getElementById('opListEndDate').value = lastRejectedDate;
                $('#opListStartDate').persianDatepicker('setDate', lastRejectedDate);
                $('#opListEndDate').persianDatepicker('setDate', lastRejectedDate);
            }
            $('#opListMachine').off('change').on('change', function() { loadOpShiftList(); });
            $('#opListSortOrder').off('change').on('change', function() { loadOpShiftList(); });
            loadOpShiftList();
        }

        async function openOpShiftList() {
            showSection('opShiftListSection');
            let today = new Date();
            let tenDaysAgo = new Date(today.getTime() - 10 * 24 * 60 * 60 * 1000);
            let startStr = new persianDate(tenDaysAgo).format('YYYY-MM-DD');
            let endStr = new persianDate(today).format('YYYY-MM-DD');
            
            document.getElementById('opListStartDate').value = startStr;
            document.getElementById('opListEndDate').value = endStr;
            $('#opListStartDate').persianDatepicker('setDate', startStr);
            $('#opListEndDate').persianDatepicker('setDate', endStr);
            
            await loadMachines();
            $('#opListMachine').off('change').on('change', function() { loadOpShiftList(); });
            $('#opListSortOrder').off('change').on('change', function() { loadOpShiftList(); });
            loadOpShiftList();
        }

        async function loadOpShiftList() {
            let start = toEnglishDigits(document.getElementById('opListStartDate').value);
            let end = toEnglishDigits(document.getElementById('opListEndDate').value);
            let mach = document.getElementById('opListMachine').value;
            let sortOrder = document.getElementById('opListSortOrder') ? document.getElementById('opListSortOrder').value : 'desc';
            if (!start || !end) return;
            try {
                const res = await fetch(`http://185.222.163.15:8000/api/operator/reports?start_date=${start}&end_date=${end}&machine=${encodeURIComponent(mach)}`, { headers: { 'Authorization': `Bearer ${authToken}` } });
                const data = await res.json();
                if (sortOrder === 'asc') data.details.reverse();
                const div = document.getElementById('opShiftListData'); div.innerHTML = '';
                if (data.details.length === 0) {
                    div.innerHTML = '<p style="text-align:center; color:#7f8c8d;">هیچ کارکردی در این بازه یافت نشد.</p>'; return;
                }
                
                let currentMachine = null;
                data.details.forEach(d => {
                    if (mach !== 'all' && currentMachine !== d.machine) {
                        div.innerHTML += `<h3 style="text-align:right; color:#2c3e50; margin-top:20px; padding-bottom:5px; border-bottom:2px solid #bdc3c7;">🧵 چرخ: ${toPersianDigits(d.machine)}</h3>`;
                        currentMachine = d.machine;
                    }
                    
                    let statusBadge = d.status === 'pending' ? '<span style="color:#e67e22;">(در انتظار تایید)</span>' : (d.status === 'rejected' ? '<span style="color:#e74c3c;">(رد شده)</span>' : '<span style="color:#2ecc71;">(تایید شده)</span>');
                    let editBtn = (d.status === 'pending' || d.status === 'rejected') ? `<button style="background:#f39c12; margin-top:10px; padding:8px; font-size:14px;" onclick="editFromList(${d.id})">✏️ ویرایش</button>` : '';
                    
                    if(d.zero_reason) {
                        div.innerHTML += `<div class="card"><div class="card-header"><strong>${formatDate(d.date)} (${d.day_name}) | ${d.shift_type}</strong> ${statusBadge}</div><div style="color:#e74c3c; font-size:14px; margin-bottom:10px;">⚠️ کارکرد صفر: ${d.zero_reason}</div>${editBtn}</div>`;
                    } else {
                        let prevWorkHtml = d.prev_work !== null ? `<br><span style="color:#7f8c8d; font-size:12px;">کارکرد شیفت مخالف: ${formatNum(d.prev_work)}</span>` : '';
                        div.innerHTML += `
                        <div class="card">
                            <div class="card-header"><strong>${formatDate(d.date)} (${d.day_name}) | ${d.shift_type}</strong> ${statusBadge}</div>
                            <img class="card-img" src="/${d.photo_path || 'static/placeholder.png'}" onclick="showImageZoom('/${d.photo_path || 'static/placeholder.png'}')">
                            <div style="font-size:13px; line-height:1.6; margin-top:10px; margin-bottom:5px;">
                                ${mach === 'all' ? `<strong>چرخ: ${toPersianDigits(d.machine)}</strong><br>` : ''}
                                شمارنده: ${formatNum(d.counter)}<br>طرح: ${toPersianDigits(d.design_code)} | ست: ${toPersianDigits(d.set_number)}<br>تکه‌ها: ${d.parts || 'ثبت نشده'}<br>
                                ${d.is_chador ? `<strong style="font-size:14px; color:#2980b9;">🧵 دوخت چادر: ${toPersianDigits(d.chador_count)} عدد ${d.chador_invoice ? '(فاکتور: '+toPersianDigits(d.chador_invoice).replace(/,/g, ' - ')+')' : ''}</strong>` : 
                                (d.work !== null ? (() => {
                                    let color = "#2ecc71"; let label = "عادی";
                                    if (d.work < 270000) { color = "#e74c3c"; label = "کم"; }
                                    else if (d.work > 300000) { color = "#f39c12"; label = "بالا"; }
                                    return `<strong style="font-size:14px; color:${color};">کارکرد: ${formatNum(d.work)} (${label})</strong>`;
                                })() : '<strong style="font-size:14px; color:#e74c3c;">کارکرد: نامشخص</strong>')}
                                ${d.jig_bonus > 0 ? `<br><span style="color:#27ae60; font-size:12px;">🎁 پاداش ${formatNum(d.jig_bonus)} بابت شروع ست جدید.</span>` : ''}
                                ${d.work === null ? `<br><span style="color:#e74c3c; font-size:12px;">⚠️ اخطار: شیفت ${d.shift_type === 'صبح' ? 'شب' : 'صبح'} ثبت/تایید نشده است.</span>` : ''}
                                ${prevWorkHtml}
                            </div>${editBtn}
                        </div>`;
                    }
                });
            } catch(e) { console.error(e); }
        }

        async function checkExistingShift() {
            loadImmediatePrev();
            
            if (editingShiftId || isEditingDateLoading) return;

            const date = toEnglishDigits(document.getElementById('date').value);
            const machine = document.getElementById('machine').value;
            if (!date || !machine) return;
            try {
                const res = await fetch(`http://185.222.163.15:8000/api/operator/check_shift?date=${date}&machine=${encodeURIComponent(machine)}`, { headers: { 'Authorization': `Bearer ${authToken}` } });
                const data = await res.json();
                const alertBox = document.getElementById('checkShiftAlert');
                const btn = document.getElementById('submitBtn');
                
                if (data.status === 'exists') {
                    alertBox.style.display = 'block';
                    if (data.is_mine) {
                        alertBox.innerHTML = `⚠️ شما برای این چرخ و تاریخ قبلا ثبت کرده‌اید! <br><button id="editExistingBtn" style="background: #c82333; margin-top:10px;">✏️ ویرایش کارکرد قبلی</button>`;
                        document.getElementById('editExistingBtn').onclick = () => loadShiftForEdit(data.shift_id);
                    } else {
                        alertBox.innerHTML = `⚠️ برای این چرخ و تاریخ، اپراتور <strong>${data.owner_name}</strong> قبلا ثبت کرده است!`;
                    }
                    btn.disabled = true; btn.innerText = "این شیفت قبلا ثبت شده است";
                } else { 
                    resetForm(); 
                }
            } catch(e) {}
        }

        function resetForm() {
            document.getElementById('checkShiftAlert').style.display = 'none';
            document.getElementById('formTitle').innerText = "📝 ثبت کارکرد";
            editingShiftId = null;
            document.getElementById('date').disabled = false;
            const btn = document.getElementById('submitBtn');
            btn.disabled = false; btn.innerText = "ارسال به مدیر";
            document.getElementById('photo').required = true;
            document.getElementById('editPhotoPreview').style.display = 'none';
            clearFields();
        }

        function toggleZeroMode() {
            const isZero = document.getElementById('isZeroWork').checked;
            if (isZero) {
                document.getElementById('normalFields').style.display = 'none';
                document.getElementById('zeroFields').style.display = 'block';
                document.getElementById('photo').required = false;
            } else {
                document.getElementById('normalFields').style.display = 'block';
                document.getElementById('zeroFields').style.display = 'none';
                document.getElementById('photo').required = !editingShiftId;
            }
        }

        async function loadShiftForEdit(id) {
            editingShiftId = id;
            isEditingDateLoading = true;
            document.getElementById('date').disabled = true;
            try {
                const res = await fetch(`http://185.222.163.15:8000/api/operator/shift/${id}`, { headers: { 'Authorization': `Bearer ${authToken}` } });
                const data = await res.json();
                if (res.ok) {
                    document.getElementById('formTitle').innerText = "✏️ ویرایش کارکرد";
                    let enDate = toEnglishDigits(data.data.date);
                    document.getElementById('date').value = toPersianDigits(enDate);
                    
                    setTimeout(() => {
                        try {
                            $('#date').persianDatepicker('setDate', enDate);
                            document.getElementById('date').value = toPersianDigits(enDate);
                        } catch(e) { console.error(e); }
                        isEditingDateLoading = false;
                    }, 100);
                    
                    document.getElementById('machine').value = data.data.machine;
                    
                    if(data.data.zero_reason) {
                        document.getElementById('isZeroWork').checked = true;
                        document.getElementById('zeroReason').value = data.data.zero_reason;
                        document.getElementById('zeroNote').value = data.data.zero_note || '';
                        toggleZeroMode();
                    } else {
                        document.getElementById('isZeroWork').checked = false;
                        document.getElementById('requestBonus').checked = (data.data.request_bonus > 0);
                        
                        if (document.getElementById('machine').value.includes('چادر')) {
                            document.getElementById('chadorCheckboxContainer').style.display = 'flex';
                            document.getElementById('isChadorWork').checked = (data.data.is_chador > 0);
                            document.getElementById('chadorCount').value = toPersianDigits(data.data.chador_count || '');
                            
                            let invoices = (data.data.chador_invoice || '').split(',');
                            for (let i = 1; i <= 6; i++) {
                                document.getElementById('chadorInvoice' + i).value = invoices[i-1] ? toPersianDigits(invoices[i-1]) : '';
                            }
                        }
                        toggleChadorMode();
                        toggleZeroMode();
                        document.getElementById('counter').value = toPersianDigits(Number(data.data.counter).toLocaleString('en-US'));
                        document.getElementById('design_code').value = toPersianDigits(data.data.design);
                        document.getElementById('set_number').value = toPersianDigits(data.data.set_number);
                        document.querySelectorAll('#parts-container input').forEach(cb => cb.checked = false);

        async function loadPendingShifts() {
            const div = document.getElementById('pendingList'); 
            if (!div) return;
            div.innerHTML = '<p style="text-align:center;">در حال دریافت اطلاعات...</p>';
            
            try {
                const res = await fetch('http://185.222.163.15:8000/api/admin/pending_shifts', { headers: { 'Authorization': `Bearer ${authToken}` } });
                if (!res.ok) throw new Error("HTTP Error " + res.status);
                const data = await res.json();
                div.innerHTML = '';
                
                if (!data.shifts || data.shifts.length === 0) {
                    div.innerHTML = '<p style="text-align:center; color:#7f8c8d; padding: 20px;">هیچ کارکردی در انتظار تایید نیست.</p>';
                    return;
                }
                
                const machSelect = document.getElementById('admFilterMachine');
                const shiftSelect = document.getElementById('admFilterShift');
                const currentMach = machSelect.value;
                const currentShift = shiftSelect.value;
                
                let machines = new Set();
                data.shifts.forEach(s => machines.add(s.machine));
                
                let opts = '<option value="all">همه چرخ‌ها</option>';
                machines.forEach(m => opts += `<option value="${m}">${toPersianDigits(m)}</option>`);
                machSelect.innerHTML = opts;
                if (machSelect.querySelector(`option[value="${currentMach}"]`)) {
                    machSelect.value = currentMach;
                }

                let filteredShifts = data.shifts.filter(s => {
                    let matchMach = (machSelect.value === 'all' || s.machine === machSelect.value);
                    let matchShift = (shiftSelect.value === 'all' || s.shift === shiftSelect.value);
                    return matchMach && matchShift;
                });

                const sortOrder = document.getElementById('admSortOrder').value;
                filteredShifts.sort((a, b) => {
                    let dateA = a.date.replace(/\//g, '-');
                    let dateB = b.date.replace(/\//g, '-');
                    if (dateA !== dateB) return sortOrder === 'desc' ? dateB.localeCompare(dateA) : dateA.localeCompare(dateB);
                    let shiftA = a.shift === 'شب' ? 2 : 1;
                    let shiftB = b.shift === 'شب' ? 2 : 1;
                    return sortOrder === 'desc' ? shiftB - shiftA : shiftA - shiftB;
                });

                if (filteredShifts.length === 0) {
                    div.innerHTML = '<p style="text-align:center;">هیچ کارکردی با این فیلتر یافت نشد.</p>';
                    return;
                }

                let groupedData = {};
                filteredShifts.forEach(s => {
                    if (!groupedData[s.machine]) groupedData[s.machine] = [];
                    groupedData[s.machine].push(s);
                });

                for (const [machineName, items] of Object.entries(groupedData)) {
                    div.innerHTML += `<h3 style="text-align:right; color:#2c3e50; margin-top:20px; padding-bottom:5px; border-bottom:2px solid #bdc3c7;">🧵 چرخ: ${toPersianDigits(machineName)}</h3>`;
                    
                    items.forEach(s => {
                        let content = "", bonusHtml = "";
                        if (s.zero_reason) {
                            content = `<div style="font-size:14px; line-height: 1.6; color:#c0392b;">چرخ: <strong>${toPersianDigits(s.machine)}</strong><br>⚠️ ثبت کارکرد صفر: <strong>${s.zero_reason}</strong><br>توضیحات: ${s.zero_note || 'ندارد'}</div>`;
                        } else {
                            if (s.potential_bonus > 0) {
                                bonusHtml = `<div style="margin-top:10px; background:#fff3cd; padding:10px; border-radius:5px; border:1px solid #ffeeba;"><label style="display:flex; align-items:center; cursor:pointer; margin:0; color:#856404;"><input type="checkbox" id="bonus_${s.id}" checked style="width:20px; height:20px; margin-left:10px; margin-bottom:0;">اعمال پاداش ${formatNum(60000)} (تایید ست جدید)</label></div>`;
                            }
                            
                            let workHtml = "";
                            if (s.is_chador) {
                                workHtml = `<br>کارکرد: <strong style="color:#2980b9;">🧵 دوخت چادر: ${toPersianDigits(s.chador_count)} عدد</strong>`;
                            } else {
                                if (s.work === null || s.work === undefined) {
                                    workHtml = `<br>کارکرد: <strong style="color:#7f8c8d;">نامشخص</strong>`;
                                } else {
                                    let color = "#2ecc71"; let label = "عادی";
                                    if (s.work < 270000) { color = "#e74c3c"; label = "کم"; }
                                    else if (s.work > 300000) { color = "#f39c12"; label = "بالا"; }
                                    workHtml = `<br>کارکرد: <strong style="color:${color};">${formatNum(s.work)} (${label})</strong>`;
                                }
                            }

                            content = `<img class="card-img" src="/${s.photo || 'static/placeholder.png'}" onclick="showImageZoom('/${s.photo || 'static/placeholder.png'}')"><div style="font-size:14px; line-height: 1.6;">چرخ: <strong>${toPersianDigits(s.machine)}</strong> | شمارنده: ${formatNum(s.counter)}<br>طرح: ${toPersianDigits(s.design)} | شماره ست: ${toPersianDigits(s.set_num)} <span style="color:#e74c3c; font-weight:bold;">(ست ${toPersianDigits(s.monthly_set_rank)} این ماه)</span><br>تکه‌ها: <strong>${s.parts || 'ثبت نشده'}</strong>${workHtml}</div>${bonusHtml}`;
                        }
                        div.innerHTML += `<div class="card"><div class="card-header"><strong>${s.op_name}</strong><span>${formatDate(s.date)} (${s.day_name}) | ${s.shift}</span></div>${content}<div class="card-actions"><button style="background:#2ecc71;" onclick="approveShift(${s.id})">✅ تایید</button><button style="background:#e74c3c;" onclick="fetch('http://185.222.163.15:8000/api/admin/reject_shift/${s.id}',{method:'POST',headers:{'Authorization':'Bearer ' + authToken}}).then(()=>loadPendingShifts())">❌ رد</button></div></div>`;
                    });
                }
            } catch(e) {
                console.error(e);
                if(div) div.innerHTML = `<p style="text-align:center; color:#e74c3c; padding: 20px;">خطا در دریافت اطلاعات.<br><small>${e.message || ''}</small><br><br>لطفا دکمه «بروزرسانی دیتا» در بالای صفحه را بزنید.</p>`;
            }
        }

        document.getElementById('manualForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const shift = document.getElementById('manShift').value;
            let opId;
            
            if (editingAdminShiftId && window.currentEditingOpId) {
                opId = window.currentEditingOpId;
            } else {
                const op = window.allOperators ? window.allOperators.find(u => u.shift_type === shift) : null;
                if (!op) { alert("اپراتوری برای این شیفت یافت نشد."); return; }
                opId = op.id;
            }
            
            const dateVal = toEnglishDigits(document.getElementById('manDate').value);
            const machine = document.getElementById('manMachine').value;
            const isZero = document.getElementById('manIsZeroWork').checked;
            
            const isChador = document.getElementById('manIsChadorWork').checked;
            const counter = isZero ? 0 : toEnglishDigits(document.getElementById('manCounter').value).replace(/,/g, '');
            const design = (isChador || isZero) ? "" : toEnglishDigits(document.getElementById('manDesign').value);
            const setNum = (isChador || isZero) ? 0 : toEnglishDigits(document.getElementById('manSetNum').value);
            const parts = (isChador || isZero) ? "" : Array.from(document.querySelectorAll('#manPartsContainer input:checked')).map(cb => cb.value).join(",");
            const chadorCount = isChador ? toEnglishDigits(document.getElementById('manChadorCount').value) : 0;
            
            let invoiceArr = [];
            if (isChador) {
                for (let i=1; i<=6; i++) {
                    let val = toEnglishDigits(document.getElementById('manChadorInv'+i).value).trim();
                    if (val) invoiceArr.push(val);
                }
                if (invoiceArr.length === 0) { alert("لطفا حداقل یک شماره فاکتور را وارد کنید."); return; }
            }
            const chadorInvoices = invoiceArr.join(',');
            const zeroReason = isZero ? document.getElementById('manZeroReason').value : null;
            const zeroNote = isZero ? document.getElementById('manZeroNote').value : null;

            const fd = new FormData();
            fd.append("operator_id", opId);
            fd.append("date", dateVal);
            fd.append("shift_type", shift);
            fd.append("machine", machine);
            fd.append("counter", counter);
            fd.append("design_code", design);
            fd.append("set_number", setNum);
            fd.append("parts", parts);
            fd.append("is_chador", isChador ? 'true' : 'false');
            fd.append("chador_count", chadorCount);
            fd.append("chador_invoice", chadorInvoices);
            fd.append("zero_reason", zeroReason || "");
            fd.append("zero_note", zeroNote || "");
            fd.append("request_bonus", document.getElementById('manRequestBonus').checked ? 'true' : 'false');
            
            const photoFile = document.getElementById('manPhoto').files[0];
            if (photoFile) fd.append("photo", photoFile);
            
            const url = editingAdminShiftId ? `http://185.222.163.15:8000/api/admin/edit_shift/${editingAdminShiftId}` : 'http://185.222.163.15:8000/api/admin/manual_shift';
            const method = editingAdminShiftId ? 'PUT' : 'POST';
            
            try {
                const res = await fetch(url, { method, headers: { 'Authorization': `Bearer ${authToken}` }, body: fd });
                if(res.ok) { alert("✅ ثبت شد"); editingAdminShiftId = null; window.currentEditingOpId = null; window.currentEditingOpName = null; showSection('adminScreen'); }
                else { const d = await res.json(); alert("❌ خطا: " + parseError(d.detail)); }
            } catch(e) { alert("❌ خطای شبکه."); }
        });

        async function loadWeeklyReport() {
            const year = document.getElementById('reportYear').value;
            const month = document.getElementById('reportMonth').value;
            const week = document.getElementById('reportWeek').value;
            
            if (!week) return;
            
            const div = document.getElementById('weeklyReportContent');
            div.innerHTML = '<p style="text-align:center;">در حال دریافت اطلاعات...</p>';
            
            try {
                const res = await fetch(`http://185.222.163.15:8000/api/reports/weekly?year=${year}&month=${month}&week_num=${week}&t=${Date.now()}`, { headers: { 'Authorization': `Bearer ${authToken}` } });
                if (!res.ok) {
                    const errText = await res.text();
                    throw new Error(errText.substring(0, 200));
                }
                const data = await res.json();
                
                if (data.status === 'empty') {
                    div.innerHTML = `<div style="text-align:center; padding:20px;">
                        <h3>${data.week_title || ''}</h3>
                        <p>هیچ کارکردی در این هفته ثبت نشده است.</p>
                    </div>`;
                    return;
                }
                
                let html = `<h3 style="text-align:center; color:#2980b9; margin-bottom:20px;">${data.week_title}</h3>`;
                html += `<p style="text-align:center; font-size:13px; color:#7f8c8d; margin-bottom:20px;">(${formatDate(data.start_date)} تا ${formatDate(data.end_date)})</p>`;
                
                const sortedWeeklyOps = Object.entries(data.operator_shifts).sort((a, b) => {
                    if (a[0].includes('صبح') && !b[0].includes('صبح')) return -1;
                    if (!a[0].includes('صبح') && b[0].includes('صبح')) return 1;
                    return 0;
                });

                for (const [op_key, machines] of sortedWeeklyOps) {
                    let opAvg = data.operator_averages && data.operator_averages[op_key] ? data.operator_averages[op_key] : 0;
                    const isOpposite = userShift && !op_key.includes(userShift);
                    const canSee = userRole === 'admin' || (data.show_salary && (!isOpposite || data.show_opposite_salary));
                    
                    html += `<div style="background:#f9f9f9; padding:15px; border-radius:8px; margin-bottom:15px; border:1px solid #ddd;">`;
                    html += `<h4 style="margin-top:0; color:#2c3e50; border-bottom:2px solid #bdc3c7; padding-bottom:5px;">👤 ${op_key} <span style="font-size:12px; color:#7f8c8d; font-weight:normal;">(میانگین روزانه: ${formatNum(opAvg)} سوزن)</span></h4>`;
                    
                    for (const [mach, work] of Object.entries(machines)) {
                        let chadorText = "";
                        if (mach.includes('چادر') && data.chador_counts && data.chador_counts[op_key]) {
                            chadorText = ` + ${toPersianDigits(data.chador_counts[op_key])} چادر`;
                        }
                        
                        let machAvg = 0;
                        if (data.op_machine_averages && data.op_machine_averages[op_key] && data.op_machine_averages[op_key][mach]) {
                            machAvg = data.op_machine_averages[op_key][mach];
                        }
                        let avgText = machAvg > 0 ? `<br><small style="color:#7f8c8d; font-size:11px;">(میانگین روزانه: ${formatNum(machAvg)})</small>` : '';
                        
                        let salaryHtml = "";
                        if (canSee && data.op_machine_salaries && data.op_machine_salaries[op_key] && data.op_machine_salaries[op_key][mach]) {
                            let sal = data.op_machine_salaries[op_key][mach];
                            salaryHtml = `<br><small style="color:#27ae60; font-weight:bold;">💰 حقوق: ${formatNum(sal)} تومان</small>`;
                        }

                        html += `<div style="display:flex; justify-content:space-between; margin-bottom:8px; border-bottom:1px dashed #eee; padding-bottom:5px;">
                            <span>${toPersianDigits(mach)}</span>
                            <div style="text-align:left;">
                                <strong>${formatNum(work)} سوزن${chadorText}</strong>
                                ${avgText}
                                ${salaryHtml}
                            </div>
                        </div>`;
                    }
                    if (canSee && data.op_salaries && data.op_salaries[op_key]) {
                        html += `<div style="background:#e8f8f5; padding:8px; border-radius:5px; text-align:center; font-weight:bold; color:#16a085; margin-top:10px;">💰 مجموع حقوق این شیفت: ${formatNum(data.op_salaries[op_key])} تومان</div>`;
                    }
                    html += `</div>`;
                }
                
                html += `<div style="background:#e8f8f5; padding:15px; border-radius:8px; margin-bottom:15px; border:1px solid #1abc9c;">`;
                html += `<h4 style="margin-top:0; color:#16a085; border-bottom:2px solid #1abc9c; padding-bottom:5px;">🧵 کل ست دوخته شده هفته</h4>`;
                
                if (data.sets_summary && data.sets_summary.length > 0) {
                    data.sets_summary.forEach(info => {
                        let rankText = "";
                        if (info.rank === 1) rankText = "اولین ست ماه";
                        else if (info.rank === 2) rankText = "دومین ست ماه";
                        else if (info.rank === 3) rankText = "سومین ست ماه";
                        else rankText = `${toPersianDigits(info.rank)}مین ست ماه`;
                        
                        let setsListHtml = "";
                        if (info.sets_list) {
                            setsListHtml = info.sets_list.map(s => `${toPersianDigits(s[0])} = ${toPersianDigits(s[1])}`).join('<br>');
                        }
                        
                        html += `<div style="margin-bottom:12px; font-size:14px; text-align:right; border-bottom:1px dashed #ccc; padding-bottom:5px;">
                            <div><strong>${toPersianDigits(info.count)} ست ${toPersianDigits(info.machine)}</strong> <span style="color:#e74c3c; font-size:12px;">(${rankText})</span></div>
                            <div style="color:#7f8c8d; font-size:12px; margin-top:3px;">${setsListHtml}</div>
                        </div>`;
                    });
                }
                html += `</div>`;
                
                html += `<div style="background:#fdf2f2; padding:15px; border-radius:8px; border:1px solid #f5c6cb;">`;
                html += `<h4 style="margin-top:0; color:#c0392b; border-bottom:2px solid #f5c6cb; padding-bottom:5px;">📊 جمع کل سوزن دو شیفت</h4>`;
                html += `<div style="display:flex; justify-content:space-between; margin-bottom:10px; font-weight:bold; font-size:16px;">
                    <span>جمع کل:</span>
                    <span>${formatNum(data.total_all)} سوزن</span>
                </div>`;
                if (data.total_salary && data.show_salary) {
                    html += `<div style="display:flex; justify-content:space-between; margin-bottom:10px; font-weight:bold; font-size:16px; color:#27ae60;">
                        <span>💰 مجموع حقوق کل:</span>
                        <span>${formatNum(data.total_salary)} تومان</span>
                    </div>`;
                }
                for (const [mach, dataObj] of Object.entries(data.machine_totals)) {
                    html += `<div style="display:flex; justify-content:space-between; margin-bottom:5px; border-top:1px dashed #eee; padding-top:5px;">
                        <span>${toPersianDigits(mach)}</span>
                        <div style="text-align:left;">
                            <strong>${formatNum(dataObj.total)} سوزن</strong><br>
                            <small style="color:#7f8c8d;">(میانگین روزانه: ${formatNum(dataObj.avg)})</small>
                        </div>
                    </div>`;
                }
                html += `</div>`;
                
                div.innerHTML = html;
            } catch(e) {
                console.error(e);
                div.innerHTML = `<p style="text-align:center; color:red;">خطا در دریافت گزارش: ${e.message || e}</p>`;
            }
        }

        async function saveMonthlyFinancials() {
            const year = document.getElementById('finYear').value;
            const month = document.getElementById('finMonth').value;
            
            const shift_financials = [];
            const machine_financials = [];
            
            let index = 0;
            while (document.getElementById('sOpName_' + index)) {
                const op_name = document.getElementById('sOpName_' + index).value;
                const shift_type = document.getElementById('sShift_' + index).value;
                
                const sReward = parseInt(toEnglishDigits(document.getElementById('sReward_' + index).value).replace(/,/g, '')) || 0;
                const sRewardTitle = document.getElementById('sRewardTitle_' + index).value;
                const sPenalty = parseInt(toEnglishDigits(document.getElementById('sPenalty_' + index).value).replace(/,/g, '')) || 0;
                const sPenaltyTitle = document.getElementById('sPenaltyTitle_' + index).value;
                
                shift_financials.push({ op_name, shift_type, reward: sReward, reward_title: sRewardTitle, penalty: sPenalty, penalty_title: sPenaltyTitle });
                
                const mCount = parseInt(document.getElementById('mMachineCount_' + index).value) || 0;
                for (let mIndex = 0; mIndex < mCount; mIndex++) {
                    const machine = document.getElementById('mMachineName_' + index + '_' + mIndex).value;
                    const mReward = parseInt(toEnglishDigits(document.getElementById('mReward_' + index + '_' + mIndex).value).replace(/,/g, '')) || 0;
                    const mRewardTitle = document.getElementById('mRewardTitle_' + index + '_' + mIndex).value;
                    const mPenalty = parseInt(toEnglishDigits(document.getElementById('mPenalty_' + index + '_' + mIndex).value).replace(/,/g, '')) || 0;
                    const mPenaltyTitle = document.getElementById('mPenaltyTitle_' + index + '_' + mIndex).value;
                    
                    machine_financials.push({ op_name, shift_type, machine, reward: mReward, reward_title: mRewardTitle, penalty: mPenalty, penalty_title: mPenaltyTitle });
                }
                
                index++;
            }
            
            try {
                const res = await fetch(`http://185.222.163.15:8000/api/admin/monthly_financials?year=${year}&month=${month}`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${authToken}` },
                    body: JSON.stringify({ shift_financials, machine_financials })
                });
                if (res.ok) alert("✅ تغییرات مالی ذخیره شد.");
                else alert("❌ خطا در ذخیره.");
            } catch(e) { alert("خطای شبکه."); }
        }

        async function loadAdminViewShifts() {
            let start = toEnglishDigits(document.getElementById('admViewStartDate').value);
            let end = toEnglishDigits(document.getElementById('admViewEndDate').value);
            let mach = document.getElementById('admViewMachineFilter').value;
            let shiftFilter = document.getElementById('admViewShiftFilter') ? document.getElementById('admViewShiftFilter').value : 'all';
            let sortOrder = document.getElementById('admViewSortOrder') ? document.getElementById('admViewSortOrder').value : 'desc';
            if (!start || !end) return;
            
            const div = document.getElementById('adminViewShiftsList');
            div.innerHTML = '<p style="text-align:center;">در حال دریافت اطلاعات...</p>';
            
            try {
                const res = await fetch(`http://185.222.163.15:8000/api/admin/all_shifts?start_date=${start}&end_date=${end}`, { headers: { 'Authorization': `Bearer ${authToken}` } });
                const data = await res.json();
                div.innerHTML = '';
                
                let filteredShifts = data.shifts.filter(d => 
                    (mach === 'all' || d.machine === mach) && 
                    (shiftFilter === 'all' || d.shift === shiftFilter)
                );
                if (sortOrder === 'asc') filteredShifts.reverse();
                if (filteredShifts.length === 0) {
                    div.innerHTML = '<p style="text-align:center; color:#7f8c8d;">هیچ کارکردی در این بازه یافت نشد.</p>'; return;
                }
                
                let currentMachine = null;
                filteredShifts.forEach(d => {
                    if (mach !== 'all' && currentMachine !== d.machine) {
                        div.innerHTML += `<h3 style="text-align:right; color:#2c3e50; margin-top:20px; padding-bottom:5px; border-bottom:2px solid #bdc3c7;">🧵 چرخ: ${toPersianDigits(d.machine)}</h3>`;
                        currentMachine = d.machine;
                    }
                    
                    let statusBadge = d.status === 'pending' ? '<span style="color:#e67e22;">(در انتظار تایید)</span>' : (d.status === 'rejected' ? '<span style="color:#e74c3c;">(رد شده)</span>' : '<span style="color:#2ecc71;">(تایید شده)</span>');
                    
                    if(d.zero_reason) {
                        div.innerHTML += `<div class="card">
                            <div class="card-header"><strong>${formatDate(d.date)} (${d.day_name}) | ${d.shift} | ${d.op_name}</strong> ${statusBadge}</div>
                            <div style="color:#e74c3c; font-size:14px; margin-bottom:10px;">⚠️ کارکرد صفر: ${d.zero_reason}</div>
                            <div class="card-actions">
                                <button style="background:#f39c12;" onclick="editAdminShift(${d.id})">✏️ ویرایش</button>
                                <button style="background:#e74c3c;" onclick="deleteAdminShift(${d.id})">🗑 حذف</button>
                            </div>
                        </div>`;
                    } else {
                        div.innerHTML += `
                        <div class="card">
                            <div class="card-header"><strong>${formatDate(d.date)} (${d.day_name}) | ${d.shift} | ${d.op_name}</strong> ${statusBadge}</div>
                            <img class="card-img" src="/${d.photo || 'static/placeholder.png'}" onclick="showImageZoom('/${d.photo || 'static/placeholder.png'}')">
                            <div style="font-size:13px; line-height:1.6; margin-top:10px; margin-bottom:5px;">
                                ${mach === 'all' ? `<strong>چرخ: ${toPersianDigits(d.machine)}</strong><br>` : ''}
                                شمارنده: ${formatNum(d.counter)}<br>طرح: ${toPersianDigits(d.design)} | ست: ${toPersianDigits(d.set_num)}<br>تکه‌ها: ${d.parts || 'ثبت نشده'}<br>
                                ${d.is_chador ? `<strong style="font-size:14px; color:#2980b9;">🧵 دوخت چادر: ${toPersianDigits(d.chador_count)} عدد</strong>` : 
                                (d.work !== null ? `<strong style="font-size:14px; color:#2ecc71;">کارکرد: ${formatNum(d.work)}</strong>` : '<strong style="font-size:14px; color:#e74c3c;">کارکرد: نامشخص</strong>')}
                            </div>
                            <div class="card-actions">
                                <button style="background:#f39c12;" onclick="editAdminShift(${d.id})">✏️ ویرایش</button>
                                <button style="background:#e74c3c;" onclick="deleteAdminShift(${d.id})">🗑 حذف</button>
                            </div>
                        </div>`;
                    }
                });
            } catch(e) {
                div.innerHTML = '<p style="text-align:center; color:red;">خطا در دریافت اطلاعات.</p>';
            }
        }

        async function editAdminShift(id) {
            editingAdminShiftId = id;
            window.currentEditingOpId = null;
            window.currentEditingOpName = null;
            showSection('adminManualSection');
            document.getElementById('manFormTitle').innerText = "✏️ ویرایش کارکرد";
            document.getElementById('manSubmitBtn').innerText = "ذخیره تغییرات";
            
            setTimeout(() => {
                fetch(`http://185.222.163.15:8000/api/admin/all_shifts?start_date=1300-01-01&end_date=1500-12-31`, { headers: { 'Authorization': `Bearer ${authToken}` } })
                .then(r => r.json()).then(data => {
                    const shift = data.shifts.find(s => s.id === id);
                    if (!shift) { alert("خطا در بارگذاری اطلاعات."); return; }
                    
                    window.currentEditingOpId = shift.op_id;
                    window.currentEditingOpName = shift.op_name;
                    
                    const infoDiv = document.getElementById('manEditingInfo');
                    if (infoDiv) {
                        infoDiv.innerHTML = `👤 این کارکرد متعلق به <strong>${shift.op_name}</strong> است<br><small style="font-weight:normal; font-size:12px;">توجه: صاحب کارکرد با تغییر شیفت عوض نمی‌شود.</small>`;
                        infoDiv.style.display = 'block';
                    }
                    
                    document.getElementById('manDate').value = toPersianDigits(shift.date);
                    $('#manDate').persianDatepicker('setDate', shift.date);
                    document.getElementById('manShift').value = shift.shift;
                    document.getElementById('manMachine').value = shift.machine;
                    document.getElementById('manCounter').value = formatNum(shift.counter);
                    
                    if (shift.is_chador) {
                        document.getElementById('manChadorCheckboxContainer').style.display = 'flex';
                        document.getElementById('manIsChadorWork').checked = true;
                        document.getElementById('manChadorCount').value = toPersianDigits(shift.chador_count || '');
                        let invs = (shift.chador_invoice || '').split(',');
                        for(let i=1; i<=6; i++) document.getElementById('manChadorInv'+i).value = invs[i-1] ? toPersianDigits(invs[i-1]) : '';
                        toggleManChadorMode();
                    } else {
                        document.getElementById('manChadorCheckboxContainer').style.display = shift.machine.includes('چادر') ? 'flex' : 'none';
                        document.getElementById('manIsChadorWork').checked = false;
                        toggleManChadorMode();
                        document.getElementById('manDesign').value = toPersianDigits(shift.design);
                        document.getElementById('manSetNum').value = toPersianDigits(shift.set_num);
                        document.querySelectorAll('#manPartsContainer input').forEach(cb => cb.checked = false);
                        if (shift.parts) {
                            let savedParts = shift.parts.split(',').map(s => s.trim());
                            document.querySelectorAll('#manPartsContainer input').forEach(cb => {
                                if (savedParts.includes(cb.value)) cb.checked = true;
                            });
                        }
                    }
                    
                    if (shift.zero_reason) {
                        document.getElementById('manIsZeroWork').checked = true;
                        document.getElementById('manZeroReason').value = shift.zero_reason;
                        document.getElementById('manZeroNote').value = shift.zero_note || '';
                        toggleManZeroMode();
                    } else {
                        document.getElementById('manIsZeroWork').checked = false;
                        toggleManZeroMode();
                    }
                    
                    setTimeout(() => triggerManFetch(), 100);
                });
            }, 300);
        }

        async function deleteAdminShift(id) {
            if (!confirm('آیا از حذف این کارکرد مطمئن هستید؟')) return;
            try {
                const res = await fetch(`http://185.222.163.15:8000/api/admin/delete_shift/${id}`, { method: 'DELETE', headers: { 'Authorization': `Bearer ${authToken}` } });
                if (res.ok) { alert('✅ حذف شد.'); loadAdminViewShifts(); }
                else alert('❌ خطا در حذف.');
            } catch(e) { alert("خطای شبکه."); }
        }

        function initAdminDelete() {
            loadDeleteMachines();
        }

        async function loadDeleteMachines() {
            try {
                const res = await fetch('http://185.222.163.15:8000/api/machines', { headers: { 'Authorization': `Bearer ${authToken}` } });
                const data = await res.json();
                const filterSelect = document.getElementById('delFilterMachine');
                if (filterSelect) {
                    filterSelect.innerHTML = '<option value="all">همه چرخ‌ها</option>' + data.machines.map(m => `<option value="${m}">${toPersianDigits(m)}</option>`).join('');
                }
            } catch(e) { console.error(e); }
            loadDeleteList();
        }

        async function loadDeleteList() {
            let mach = document.getElementById('delFilterMachine').value;
            let shift = document.getElementById('delFilterShift').value;
            
            try {
                const res = await fetch(`http://185.222.163.15:8000/api/admin/all_shifts?start_date=1300-01-01&end_date=1500-12-31`, { headers: { 'Authorization': `Bearer ${authToken}` } });
                const data = await res.json();
                const div = document.getElementById('deleteList'); div.innerHTML = '';
                
                let filtered = data.shifts.filter(d => (mach === 'all' || d.machine === mach) && (shift === 'all' || d.shift === shift));
                if (filtered.length === 0) {
                    div.innerHTML = '<p style="text-align:center;">لیست خالی است.</p>';
                    return;
                }
                
                let grouped = {};
                filtered.forEach(d => {
                    if (!grouped[d.machine]) grouped[d.machine] = [];
                    grouped[d.machine].push(d);
                });
                
                for (const [machineName, items] of Object.entries(grouped)) {
                    div.innerHTML += `<h3 style="text-align:right; color:#2c3e50; margin-top:20px; padding-bottom:5px; border-bottom:2px solid #bdc3c7;">🧵 چرخ: ${toPersianDigits(machineName)}</h3>`;
                    items.forEach(d => {
                        div.innerHTML += `<div class="machine-row"><div>${formatDate(d.date)} (${d.day_name}) | ${d.op_name} | ${d.shift}</div><button style="background:#e74c3c; width:60px;" onclick="deleteAdminShiftFromList(${d.id})">حذف</button></div>`;
                    });
                }
            } catch(e) {
                document.getElementById('deleteList').innerHTML = '<p style="text-align:center; color:#e74c3c; font-weight:bold;">خطا در دریافت اطلاعات!</p>';
            }
        }

        async function deleteAdminShiftFromList(id) {
            if (!confirm('حذف شود؟')) return;
            try {
                const res = await fetch(`http://185.222.163.15:8000/api/admin/delete_shift/${id}`, { method: 'DELETE', headers: { 'Authorization': `Bearer ${authToken}` } });
                if (res.ok) { alert('حذف شد'); loadDeleteList(); }
            } catch(e) {}
        }

        async function initAdminSearch() {
            try {
                const res = await fetch('http://185.222.163.15:8000/api/machines', { headers: { 'Authorization': `Bearer ${authToken}` } });
                const data = await res.json();
                const sel = document.getElementById('srchMachine');
                if (sel) {
                    sel.innerHTML = '<option value="">همه</option>' + data.machines.map(m => `<option value="${m}">${toPersianDigits(m)}</option>`).join('');
                }
            } catch(e) { console.error(e); }
            document.getElementById('adminSearchResults').innerHTML = '<p style="text-align:center; color:#7f8c8d;">فیلترها را انتخاب کنید و دکمه جستجو را بزنید.</p>';
        }

        async function loadAdminSearch() {
            const design = toEnglishDigits(document.getElementById('srchDesign').value.trim());
            const setNum = toEnglishDigits(document.getElementById('srchSetNum').value.trim());
            const parts = document.getElementById('srchParts').value;
            const machine = document.getElementById('srchMachine').value;
            const shift = document.getElementById('srchShift').value;
            const sortOrder = document.getElementById('srchSortOrder').value;
            
            const div = document.getElementById('adminSearchResults');
            div.innerHTML = '<p style="text-align:center;">در حال جستجو...</p>';
            
            let url = `http://185.222.163.15:8000/api/admin/search_shifts?sort_order=${sortOrder}`;
            if (design) url += `&design_code=${encodeURIComponent(design)}`;
            if (setNum) url += `&set_number=${encodeURIComponent(setNum)}`;
            if (parts) url += `&parts=${encodeURIComponent(parts)}`;
            if (machine) url += `&machine=${encodeURIComponent(machine)}`;
            if (shift) url += `&shift=${encodeURIComponent(shift)}`;
            
            try {
                const res = await fetch(url, { headers: { 'Authorization': `Bearer ${authToken}` } });
                const data = await res.json();
                div.innerHTML = '';
                
                if (!data.shifts || data.shifts.length === 0) {
                    div.innerHTML = '<p style="text-align:center; color:#7f8c8d;">هیچ نتیجه‌ای یافت نشد.</p>';
                    return;
                }
                
                div.innerHTML += `<div style="background:#9b59b6; color:white; padding:10px; border-radius:8px; text-align:center; margin-bottom:15px; font-weight:bold;">🔍 ${toPersianDigits(data.total)} نتیجه یافت شد</div>`;
                
                data.shifts.forEach(d => {
                    let statusBadge = d.status === 'pending' ? '<span style="color:#e67e22;">(در انتظار تایید)</span>' : (d.status === 'rejected' ? '<span style="color:#e74c3c;">(رد شده)</span>' : '<span style="color:#2ecc71;">(تایید شده)</span>');
                    
                    if (d.zero_reason) {
                        div.innerHTML += `<div class="card">
                            <div class="card-header"><strong>${formatDate(d.date)} (${d.day_name}) | ${d.shift} | ${d.op_name}</strong> ${statusBadge}</div>
                            <div style="color:#e74c3c; font-size:14px; margin-bottom:10px;">⚠️ کارکرد صفر: ${d.zero_reason}</div>
                            <div style="font-size:13px;">چرخ: ${toPersianDigits(d.machine)}</div>
                        </div>`;
                    } else {
                        let workHtml = d.is_chador ? `<strong style="color:#2980b9;">🧵 چادر: ${toPersianDigits(d.chador_count)} عدد</strong>` :
                            (d.work !== null ? `<strong style="color:#2ecc71;">کارکرد: ${formatNum(d.work)}</strong>` : '<strong style="color:#e74c3c;">نامشخص</strong>');
                        div.innerHTML += `<div class="card">
                            <div class="card-header"><strong>${formatDate(d.date)} (${d.day_name}) | ${d.shift} | ${d.op_name}</strong> ${statusBadge}</div>
                            ${d.photo ? `<img class="card-img" src="/${d.photo}" onclick="showImageZoom('/${d.photo}')">` : ''}
                            <div style="font-size:13px; line-height:1.6;">
                                <strong>چرخ:</strong> ${toPersianDigits(d.machine)} | <strong>شمارنده:</strong> ${formatNum(d.counter)}<br>
                                <strong>طرح:</strong> ${toPersianDigits(d.design)} | <strong>ست:</strong> ${toPersianDigits(d.set_num)} | <strong>تکه‌ها:</strong> ${d.parts || 'ثبت نشده'}<br>
                                ${workHtml}
                            </div>
                        </div>`;
                    }
                });
            } catch(e) {
                div.innerHTML = '<p style="text-align:center; color:red;">خطا در جستجو.</p>';
            }
        }

        // ── v16.6: Machine Management (Force Injected) ──
        async function loadAdminMachines() {
            const div = document.getElementById('machineList');
            if (!div) return;
            div.innerHTML = '<p style="text-align:center;">در حال دریافت...</p>';
            try {
                const res = await fetch('http://185.222.163.15:8000/api/admin/machines', { headers: { 'Authorization': `Bearer ${authToken}` } });
                if (!res.ok) throw new Error("HTTP " + res.status);
                const data = await res.json();
                div.innerHTML = '';
                if (!data.machines || data.machines.length === 0) {
                    div.innerHTML = '<p style="text-align:center; color:#7f8c8d;">هیچ چرخی ثبت نشده است.</p>';
                    return;
                }
                data.machines.forEach(m => {
                    div.innerHTML += `<div class="machine-row">
                        <div>
                            <strong style="font-size:16px; color:#2c3e50;">${toPersianDigits(m.name)}</strong><br>
                            <small style="color:#7f8c8d;">ریست: ${formatNum(m.reset_period)} | شروع: ${formatNum(m.start_counter)}</small>
                        </div>
                        <button style="background:#f39c12; width:70px; margin:0;" onclick="editMachine('${m.name}', ${m.reset_period}, ${m.start_counter})">ویرایش</button>
                    </div>`;
                });
            } catch(e) {
                div.innerHTML = '<p style="text-align:center; color:#e74c3c;">خطا در دریافت اطلاعات چرخ‌ها.</p>';
                console.error(e);
            }
        }

        async function addMachine() {
            const input = document.getElementById('newMachineName');
            const name = input.value.trim();
            if (!name) { alert('نام چرخ را وارد کنید'); return; }
            const res = await fetch('http://185.222.163.15:8000/api/admin/machines', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${authToken}` },
                body: JSON.stringify({ name: name, reset_period: 5000000, start_counter: 0 })
            });
            if (res.ok) { input.value = ''; loadAdminMachines(); }
            else { alert('خطا (شاید نام تکراری است)'); }
        }

        async function editMachine(name, reset, start) {
            const newReset = prompt(`ریست پریود (فعلی ${reset}):`, reset);
            if (newReset === null) return;
            const newStart = prompt(`شمارنده شروع (فعلی ${start}):`, start);
            if (newStart === null) return;
            const res = await fetch(`http://185.222.163.15:8000/api/admin/machines/${encodeURIComponent(name)}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${authToken}` },
                body: JSON.stringify({ reset_period: parseInt(newReset) || 5000000, start_counter: parseInt(newStart) || 0 })
            });
            if (res.ok) loadAdminMachines(); else alert('خطا در ذخیره');
        }
    </script>
